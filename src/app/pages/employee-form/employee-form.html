<div class="container" style="max-width: 860px">
  <!-- Page Header -->
  <div class="page-header">
    <h4><i class="bi bi-person-plus me-2"></i>Add Employee</h4>
    <p>Fill in the details below to register a new employee.</p>
  </div>

  <!-- Section 1: Basic Information -->
  <div class="section-card">
    <div class="section-heading">
      <div class="section-icon"><i class="bi bi-person"></i></div>
      <h6 class="section-title">Basic information</h6>
    </div>
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Full name <span class="required-star">*</span></label>
        <input
          type="text"
          [(ngModel)]="newEmployeeobj.name"
          class="form-control"
          placeholder="e.g. John Smith"
        />
      </div>
      <div class="col-md-6">
        <label class="form-label">Contact Number <span class="required-star">*</span></label>
        <input
          type="text"
          [(ngModel)]="newEmployeeobj.contactNo"
          class="form-control"
          placeholder="e.g. John Smith"
        />
      </div>
      <div class="col-md-6">
        <label class="form-label">Alt Contact Number <span class="required-star">*</span></label>
        <input
          type="text"
          [(ngModel)]="newEmployeeobj.altContactNo"
          class="form-control"
          placeholder="e.g. John Smith"
        />
      </div>
      <div class="col-md-6">
        <label class="form-label">Email <span class="required-star">*</span></label>
        <input
          type="text"
          [(ngModel)]="newEmployeeobj.email"
          class="form-control"
          placeholder="e.g. John Smith"
        />
      </div>
      <div class="col-md-6">
        <label class="form-label">State <span class="required-star">*</span></label>
        <input
          type="text"
          [(ngModel)]="newEmployeeobj.state"
          class="form-control"
          placeholder="e.g. John Smith"
        />
      </div>
      <div class="col-md-6">
        <label class="form-label">City <span class="required-star">*</span></label>
        <input
          type="text"
          [(ngModel)]="newEmployeeobj.city"
          class="form-control"
          placeholder="e.g. John Smith"
        />
      </div>
      <div class="col-md-6">
        <label class="form-label">PinCode <span class="required-star">*</span></label>
        <input
          type="text"
          [(ngModel)]="newEmployeeobj.pincode"
          class="form-control"
          placeholder="e.g. John Smith"
        />
      </div>
      <div class="col-md-3">
        <label class="form-label">Department <span class="optional-badge">optional</span></label>
        <!-- Department: local filter only -->
        <select class="form-select" [(ngModel)]="selectedDepartmentId">
          <option [value]="0">Select department</option>
          @for (item of departmentList$ | async; track $index) {
            <option [value]="item.departmentId">{{ item.departmentName }}</option>
          }
        </select>
      </div>
      <div class="col-md-3">
        <label class="form-label">Designation <span class="required-star">*</span></label>
        <!-- Designation: bound to employee model -->
        <select class="form-select" [(ngModel)]="newEmployeeobj.designationId">
          <option [value]="0">Select designation</option>
          @for (item of $designationList | async; track $index) {
            <option [value]="item.designationId">{{ item.designationName }}</option>
          }
        </select>
      </div>
      <div class="col-md-3">
        <label class="form-label">Role <span class="required-star">*</span></label>
        <select class="form-select" [(ngModel)]="newEmployeeobj.role">
          <option value="">Select role</option>
          <option>Admin</option>
          <option>Manager</option>
          <option>HR</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Action Buttons -->
  <div class="action-row">
    <button type="button" class="btn-reset">Reset</button>
    <button type="button" class="btn-save" (click)="onSaveEmployee()">
      <i class="bi bi-check-lg me-1"></i> Save employee
    </button>
  </div>
</div>
